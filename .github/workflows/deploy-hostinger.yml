# Deploy automático para Hostinger via FTP/FTPS
# Secrets: HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD, HOSTINGER_FTP_SERVER_DIR
# NÃO sobrescreve .env no servidor.

name: Deploy Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'deploy/hostinger/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/deploy-hostinger.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar pasta de deploy (estrutura plana public_html)
        run: |
          set -e
          mkdir -p release
          cp -a app release/app
          # assets de public/ na raiz (sem index/htaccess de dev)
          rsync -a --exclude 'index.php' --exclude '.htaccess' public/ release/
          # front controller Hostinger (plano)
          cp deploy/hostinger/index.php release/index.php
          cp deploy/hostinger/public_html.htaccess release/.htaccess
          cp deploy/hostinger/upgrade-db.php release/upgrade-db.php
          cp deploy/hostinger/upgrade.sql release/upgrade.sql
          cp deploy/hostinger/check-setup.php release/check-setup.php 2>/dev/null || true
          cp composer.json composer.lock spark preload.php release/ 2>/dev/null || true
          # writable skeleton (não apaga logs remotos se exclude)
          mkdir -p release/writable/{cache,logs,session,uploads,debugbar}
          for d in cache logs session uploads debugbar; do
            echo '<!DOCTYPE html><title>403</title>' > "release/writable/$d/index.html"
          done
          echo '<!DOCTYPE html><title>403</title>' > release/writable/index.html
          find release -type f | wc -l
          ls -la release | head -30

      - name: Deploy FTP/FTPS (preserva .env e vendor)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
          local-dir: ./release/
          protocol: ftps
          dangerous-clean-slate: false
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/vendor/**
            **/writable/cache/**
            **/writable/logs/**
            **/writable/session/**
            **/writable/debugbar/**
            **/tests/**
            **/deploy/pacotes/**
